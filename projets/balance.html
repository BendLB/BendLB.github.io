.side .emo{font-size:1.8rem;line-height:1}

button{font-family:var(--f-body);font-size:1rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:46px}

button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.step{font-family:var(--f-mono);font-size:.9rem;padding:8px 12px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700;width:100%}

.track i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--brass);transform:translate(-50%,-50%)}
.rung.new .track i{background:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb, var(--blue) 25%, transparent)}
.axis .lab{position:relative;height:1.6rem;font-size:.75rem;color:var(--muted)}
.axis .lab span{position:absolute;top:0;transform:translateX(-50%)}
.empty{font-size:.9rem;color:var(--muted);margin:0}

/* ---------- MathJax ---------- */
function setTex(el, tex, display){ el.dataset.tex = tex; el.dataset.disp = display ? '1' : ''; renderTex(el); }
function renderTex(el){
  if (window.__mj && window.MathJax && MathJax.tex2svg){
    try { el.replaceChildren(MathJax.tex2svg(el.dataset.tex, {display: !!el.dataset.disp})); return; } catch(e){}
  }
  el.textContent = el.dataset.tex.replace(/\\times/g,'×').replace(/\\approx/g,'≈').replace(/\{,\}/g,',').replace(/\\,|\\ /g,' ').replace(/[{}\\]/g,'');
}
function renderAllTex(){ document.querySelectorAll('[data-tex]').forEach(renderTex); }

/* ---------- Number formatting ---------- */
function parts(x){
  let e = Math.floor(Math.log10(x));
  if (e >= -2 && e <= 5){
    const s = Number(x.toPrecision(e >= 2 ? e + 1 : 2)).toLocaleString('fr-FR', {maximumSignificantDigits: 3});
    return {plain: s};
  }
  let m = Math.round(x / Math.pow(10, e) * 10) / 10;
  if (m >= 10){ m = 1; e++; }
  return {m: (m % 1 === 0 ? m.toFixed(0) : m.toFixed(1)).replace('.', ','), e};
}
function numTex(x){
  if (!(x > 0)) return '0';
  const p = parts(x);
  if (p.plain) return p.plain.replace(/,/g, '{,}').replace(/[\s  ]/g, '\\,');
  const m = p.m.replace(',', '{,}');
  return m === '1' ? `10^{${p.e}}` : `${m} \\times 10^{${p.e}}`;
}
function numSvg(x){
  const p = parts(x);
  if (p.plain) return '× ' + p.plain;
  return `× ${p.m === '1' ? '' : p.m + '·'}10<tspan dy="-7" font-size="10">${p.e}</tspan>`;
}

/* ---------- Balance ---------- */
const P = {x:180, y:70}, L = 140;
function draw(deg){
  const r = deg * Math.PI / 180;
  $('beam').setAttribute('transform', `rotate(${deg} ${P.x} ${P.y})`);
  $('panL').setAttribute('transform', `translate(${P.x - L*Math.cos(r)} ${P.y - L*Math.sin(r)})`);
  $('panR').setAttribute('transform', `translate(${P.x + L*Math.cos(r)} ${P.y + L*Math.sin(r)})`);
}
let anim = null, cur = 0, vel = 0;
function swingTo(target){
  cancelAnimationFrame(anim);
  if (reduce()){ cur = target; draw(target); return; }
  let last = performance.now();
  const step = now => {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    vel += (-60 * (cur - target) - 3.4 * vel) * dt; cur += vel * dt; draw(cur);
    if (Math.abs(cur - target) > 0.02 || Math.abs(vel) > 0.05) anim = requestAnimationFrame(step);
    else { cur = target; vel = 0; draw(cur); }
  };
  anim = requestAnimationFrame(step);
}
/* right-hand object grows with the number entered (log scale) */
function setRight(n, label = n){
  const t = Math.max(0, Math.min(1, (Math.log10(n) + 16) / 32));
  $('emoB').setAttribute('font-size', (14 + t * 42).toFixed(1));
  $('multB').innerHTML = numSvg(label);
}

/* ---------- Game ---------- */
let S;
function pickPairs(){
  const pairs = [], seen = new Set();
  let guard = 0;
  while (pairs.length < ROUNDS && guard++ < 5000){
    const a = ITEMS[Math.floor(Math.random()*ITEMS.length)];
    const ok = ITEMS.filter(b => b !== a && Math.abs(Math.log10(a.E / b.E)) >= 0.3 && Math.abs(Math.log10(a.E / b.E)) <= 15.5);
    if (!ok.length) continue;
    const b = ok[Math.floor(Math.random()*ok.length)];
    if (seen.has(a.id) || seen.has(b.id)) continue;
    seen.add(a.id); seen.add(b.id); pairs.push([a.id, b.id]);
  }
  return pairs;
}
function newGame(){
  S = {round:0, total:0, pairs:pickPairs(), hist:[]};
  $('end').hidden = true; $('game').hidden = false;
  startRound();
}
function startRound(){
  const [ia, ib] = S.pairs[S.round], A = byId[ia], B = byId[ib];
  Object.assign(S, {A, B, ans: A.E / B.E});
  $('rnd').textContent = S.round + 1; $('score').textContent = S.total;
  $('eA').textContent = A.emo; $('nA').textContent = A.sg;
  $('eB').textContent = B.emo; $('nB').textContent = B.sg;
  $('emoA').textContent = A.emo; $('emoB').textContent = B.emo;
  $('slider').value = 0;
  $('controls').style.display = 'flex'; $('result').hidden = true;
  ['sideA','panL'].forEach(id => $(id).dataset.item = A.id);
  ['sideB','panR'].forEach(id => $(id).dataset.item = B.id);
  hideTip();
  cancelAnimationFrame(anim); cur = 0; vel = 0; draw(0);
  updateGuess();
}
/* Ordre de grandeur : a × 10^n donne 10^n si a < 5, 10^(n+1) si a ≥ 5 */
function orderOf(x){
  let e = Math.floor(Math.log10(x)), a = x / Math.pow(10, e);
  if (a >= 10 - 1e-9){ e++; a /= 10; }
  return a >= 5 - 1e-9 ? e + 1 : e;
}
const guessVal = () => Math.pow(10, Number($('slider').value));
function updateGuess(){
  setRight(guessVal());
}
$('slider').addEventListener('input', updateGuess);
$('div10').onclick = () => { $('slider').value = Math.max(-16, Number($('slider').value) - 1); updateGuess(); };
$('mul10').onclick = () => { $('slider').value = Math.min(16, Number($('slider').value) + 1); updateGuess(); };

/* ---------- Energy ladder (persists in this browser) ---------- */
let found = [];
try { found = JSON.parse(localStorage.getItem('be-found-v2') || '[]').filter(id => byId[id]); } catch(e){}
function discover(ids){
  const fresh = ids.filter(id => !found.includes(id));
  found.push(...fresh);
  try { localStorage.setItem('be-found-v2', JSON.stringify(found)); } catch(e){}
  renderLadder(fresh);
}
function renderLadder(fresh = []){
  $('found').textContent = found.length + ' / ' + ITEMS.length + ' découverts';
  const lad = $('ladder');
  if (!found.length){ lad.innerHTML = '<p class="empty">Pesez votre premier objet pour commencer l\'échelle.</p>'; return; }
  const list = found.map(id => byId[id]).sort((a, b) => b.E - a.E);
  lad.innerHTML = list.map(it => {
    const pos = Math.max(0, Math.min(100, (Math.log10(it.E) + 25) / 75 * 100));
    return `<div class="rung${fresh.includes(it.id) ? ' new' : ''}" data-item="${it.id}"><span class="e">${it.emo}</span><div>
      <div class="top"><span>${it.sg}${fresh.includes(it.id) ? '<span class="badge">nouveau</span>' : ''}</span><span class="v" data-v="${it.id}"></span></div>
      <div class="track"><i style="left:${pos}%"></i></div></div></div>`;
  }).join('');
  lad.querySelectorAll('[data-v]').forEach(el => setTex(el, numTex(byId[el.dataset.v].E) + '\\ \\text{J}'));
}
[-20, 0, 20, 40].forEach((e, i) => { const el = $('ax' + i); el.style.left = ((e + 25) / 75 * 100) + '%'; setTex(el, `10^{${e}}`); });
renderLadder();

$('weigh').onclick = () => {
  const n = Math.round(Number($('slider').value)), g = Math.pow(10, n);
  const target = orderOf(S.ans), diff = Math.abs(n - target);
  const lr = n - Math.log10(S.ans);
  const pts = Math.max(0, 100 - 10 * diff);
  S.total += pts; S.hist.push({A:S.A, B:S.B, pts});
  $('score').textContent = S.total;
  $('controls').style.display = 'none';

  swingTo(18 * Math.tanh(lr / 1.5));
  if (diff > 0) setTimeout(() => {
    if (S.hist.length !== S.round + 1) return;
    setRight(S.ans, Math.pow(10, target)); swingTo(0);
  }, reduce() ? 1200 : 1800);

  const [cls, txt] = diff === 0 ? ['good','Bon ordre de grandeur'] : diff === 1 ? ['ok','À une puissance de 10 près'] :
                     diff <= 3 ? ['near','Pas loin'] : ['bad','Raté'];
  $('vt').className = 't ' + cls; $('vt').textContent = txt; $('vp').textContent = '+' + pts + ' pts';
  setTex($('yourTex'), `10^{${n}}`);
  setTex($('goodTex'), `10^{${target}}`);
  discover([S.A.id, S.B.id]);
  $('wA').textContent = S.A.emo + ' 1 ' + S.A.sg; setTex($('fA'), S.A.tex);
  $('wB').textContent = S.B.emo + ' 1 ' + S.B.sg; setTex($('fB'), S.B.tex);
  setTex($('fR'), `\\frac{${numTex(S.A.E)}\\ \\text{J}}{${numTex(S.B.E)}\\ \\text{J}} \\approx ${numTex(S.ans)}`, true);
  $('next').textContent = S.round + 1 >= ROUNDS ? 'Voir le résultat' : 'Manche suivante';
  $('result').hidden = false;
};
$('next').onclick = () => {
  S.round++;
  if (S.round >= ROUNDS) return endGame();
  startRound(); window.scrollTo({top:0, behavior: reduce() ? 'auto' : 'smooth'});
};
function endGame(){
  $('game').hidden = true; $('end').hidden = false;
  $('final').textContent = S.total + ' / 1000';
  $('rank').textContent = S.total >= 900 ? 'Instinct de physicien : les ordres de grandeur vous obéissent.' :
    S.total >= 700 ? 'Bonne intuition, quelques puissances de dix vous ont échappé.' : 'Les joules gardent leurs secrets. Une autre partie ?';
  $('hist').innerHTML = S.hist.map(r => `<span>${r.A.emo} 1 ${r.A.sg} = ${r.B.emo} ?</span><span>${r.pts}</span>`).join('');
  window.scrollTo({top:0});
}
$('again').onclick = newGame;

/* ---------- Info-bulles : survol à la souris, tap sur mobile ---------- */
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip');
document.body.appendChild(tip);
let tipFor = null;
function showTip(el){
  const it = byId[el.dataset.item]; if (!it) return;
  tip.innerHTML = '';
  const b = document.createElement('b'); b.textContent = it.emo + ' ' + it.sg;
  const t = document.createElement('span'); t.textContent = it.desc;
  tip.append(b, t); tip.hidden = false; tipFor = el;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), innerWidth - w - 16);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.hidden = true; tipFor = null; }
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('[data-item]'); if (el && el !== tipFor) showTip(el);
});
document.addEventListener('pointerout', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('[data-item]');
  if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hideTip();
});
let lastPointer = 'mouse';
document.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'touch'; }, true);
document.addEventListener('touchstart', () => { lastPointer = 'touch'; }, {capture: true, passive: true});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-item]');
  if (el && lastPointer === 'mouse') return;
  if (el && el !== tipFor) showTip(el); else hideTip();
});
addEventListener('scroll', hideTip, {passive: true});
newGame();
</script>
