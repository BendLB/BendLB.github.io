let pool = [];
let current = null;
let answered = false;

function refillPool() {
  pool = [...allQuestions];
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
}

function nextQuestion() {
  if (pool.length === 0) refillPool();
  current = pool.pop();
  answered = false;
  render();
}

const questionText = document.getElementById('questionText');
const choicesEl = document.getElementById('choices');
const explanation = document.getElementById('explanation');
const explainBtn = document.getElementById('explainBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  questionText.textContent = current.text;
  explanation.classList.remove('show');
  explanation.textContent = '';
  explainBtn.classList.remove('show');
  nextBtn.classList.remove('show');

  // shuffle choice display order
  const shuffled = [...current.choices];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  choicesEl.innerHTML = '';
  shuffled.forEach(choiceText => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choiceText;
    btn.addEventListener('click', () => handleChoice(btn, choiceText));
    choicesEl.appendChild(btn);
  });
}

function handleChoice(btn, choiceText) {
  if (answered) return;
  answered = true;
  const isCorrect = choiceText === current.correct;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === current.correct) {
      b.classList.add(isCorrect ? 'correct' : 'reveal-correct');
    } else if (b === btn) {
      b.classList.add('incorrect');
    }
  });

  explainBtn.classList.add('show');
  nextBtn.classList.add('show');
}

explainBtn.addEventListener('click', () => {
  explanation.textContent = current.explanation;
  explanation.classList.add('show');
});

nextBtn.addEventListener('click', nextQuestion);

nextQuestion();
</script>
