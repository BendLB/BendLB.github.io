const POP=['minkm','minmi','m','km','cm','mm','kg','g','lb','C','Fh','L','mi','in','ft','kmh','mph','oz','mL','h','min','t','m2','ha','kWh','kcal','bar','psi','yd','gal','floz','d','s','kW','hp','ch','Go','Mo','acre','ft2','kn','atm','deg','pct','rad','J','W','N','K','tr','grad'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/²/g,'2').replace(/³/g,'3').replace(/[µμ]/g,'u').replace(/°/g,'').replace(/\s+/g,' ').trim();
const U={};
RAW.forEach(r=>{const [id,d,f,sym,name,al,usual,sys]=r;
  U[id]={id,d,f,sym,name,usual:!!usual,sys,nsym:norm(sym),words:[norm(sym),norm(name),...norm(al).split(' ')].filter(Boolean),pop:POP.indexOf(id)<0?999:POP.indexOf(id)};});

// ---------- Calcul ----------
// Multiples décimaux de l'unité de base : pas de ligne « SI » pour eux (10 km ≠ besoin de 10 000 m)
const PREFIXED=new Set(['km','dm','cm','mm','um','nm','g','mg','t','L','mL','cL','dL','cm3','km2','cm2','ha','are','msec','hPa','kPa','MPa','bar','mbar','kJ','MJ','kW','MW','kN','mrad','ko','Mo','Go','To']);
const paceK=u=>typeof u.f==='string'&&u.f.startsWith('PACE:')?+u.f.slice(5)/60:0;
function toBase(v,u){if(u.f==='PCT')return Math.atan(v/100);
  if(paceK(u))return v===0?Infinity:paceK(u)/v;
  if(u.d!=='T')return v*u.f;
  return u.f==='C'?v+273.15:u.f==='F'?(v-32)*5/9+273.15:u.f==='R'?v*5/9:v;}
function fromBase(b,u){if(paceK(u))return b===0?Infinity:paceK(u)/b;
  if(u.f==='PCT'){const c=Math.cos(b);return Math.abs(c)<1e-12?Infinity:Math.tan(b)*100;}
  if(u.d!=='T')return b/u.f;
  return u.f==='C'?b-273.15:u.f==='F'?(b-273.15)*9/5+32:u.f==='R'?b*9/5:b;}
const nf=new Intl.NumberFormat('fr-FR',{maximumSignificantDigits:6});
function fmt(v){
  if(!isFinite(v))return isNaN(v)?'—':(v<0?'−':'')+'∞'; if(v===0)return '0';
  const a=Math.abs(v);
  if(a>=1e9||a<1e-4){let e=Math.floor(Math.log10(a));let m=Number((v/Math.pow(10,e)).toPrecision(4));
    if(Math.abs(m)>=10){m/=10;e++;}
    return new Intl.NumberFormat('fr-FR',{maximumSignificantDigits:4}).format(m)+'&#8239;×&#8239;10<sup>'+(e<0?'−':'')+Math.abs(e)+'</sup>';}
  return nf.format(v);
}
function paceTxt(v){if(!isFinite(v)||v<=0)return '∞';let t=Math.round(v*60),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');}
const show=(v,u)=>paceK(u)?paceTxt(v):fmt(v), copyv=(v,u)=>paceK(u)?paceTxt(v):plain(v);
function plain(v){if(!isFinite(v))return '∞';return String(Number(v.toPrecision(6))).replace('.',',');}

function rowsFor(card){
  const u=U[card.u], b=toBase(card.v,u), base=U[DIMS[u.d].base], out=[], seen=new Set([u.id]);
  if(u.d==='S'){ // vitesse et allure : jeu fixe, quelle que soit l'unité saisie
    ['kmh','minkm','ms_','mph','minmi'].concat(card.extra||[]).forEach(id=>{if(!seen.has(id)&&U[id]){out.push({u:U[id],v:fromBase(b,U[id]),k:(card.extra||[]).includes(id)?'+':''});seen.add(id);}});
    return out;}
  // seen = unités réellement affichées ; la base n'y entre que si sa ligne est affichée
  // longueurs : jamais de ligne en mètres par défaut
  // surfaces : m² toujours en premier (sauf saisie en m²)
  if(u.id!==base.id&&(u.d==='A'||!PREFIXED.has(u.id)&&u.d!=='L'&&u.d!=='M')){out.push({u:base,v:b,k:DIMS[u.d].si?'SI':'réf.',si:true});seen.add(base.id);}
  let mixed=false;
  if(u.d==='L'&&b!==0){const mx=mixedImp(b);
    if(mx&&mx.text!==plain(card.v).replace(',','.')+' '+u.sym){out.push({html:mx.html,copy:mx.text,k:'imp.',name:mx.name});mixed=true;}}
  const val=x=>fromBase(b,x);
  // valeur « lisible » : entre 1 et 1000 de préférence
  const ugly=x=>{const a=Math.abs(val(x));if(!isFinite(a)||a===0)return 0;const l=Math.log10(a);return l<0?-l:l>3?l-3:0;};
  const byNice=(x,y)=>ugly(x)-ugly(y)||x.pop-y.pop;
  const cand=Object.values(U).filter(x=>x.d===u.d&&x.usual&&(x.id!==base.id||u.d==='M')&&!seen.has(x.id));  // masse : kg, g ou t, le mieux adapté
  let list;
  if(u.sys==='m'){const o=cand.filter(x=>x.sys!=='m').sort(byNice);list=o.length?o.concat(cand.filter(x=>x.sys==='m').sort(byNice)):cand.sort(byNice);}
  else{const met=cand.filter(x=>x.sys==='m').sort(byNice);list=met.slice(0,u.d==='A'?0:1).concat(cand.filter(x=>x.sys!=='m').sort(byNice));}
  // longueur métrique : la notation impériale mixte suffit
  const max=(u.d==='L'&&u.sys==='m'&&mixed)?0:mixed?2:3;
  const mixText=mixed?out[out.length-1].copy:null;
  let pick=list.filter(x=>plain(val(x)).replace(',','.')+' '+x.sym!==mixText).filter(x=>{if(u.d==='T'||card.v===0)return true;const a=Math.abs(val(x));return !isFinite(a)||(a>=.01&&a<1e6);});
  // pour une source métrique, on ne montre que l'autre système s'il en existe
  if(u.sys==='m'&&pick.some(x=>x.sys!=='m'))pick=pick.filter(x=>x.sys!=='m');
  pick=pick.slice(0,max);
  if(max&&!pick.length)list.forEach(x=>{if(!pick.length&&ugly(x)<3&&!pick.includes(x))pick.push(x);});
  if(!pick.length&&!out.length&&list.length)pick=[list[0]];   // jamais de carte vide
  pick.forEach(x=>{out.push({u:x,v:val(x),k:''});seen.add(x.id);});
  (card.extra||[]).forEach(id=>{if(!seen.has(id)&&U[id]){out.push({u:U[id],v:val(U[id]),k:'+'});seen.add(id);}});
  return out;
}

// Notation impériale mixte : mi / ft / in + fraction au 1/16 de pouce
function mixedImp(meters){
  const neg=meters<0, abs=Math.abs(meters), big=abs>=1609.344;
  let r=Math.round(abs/.0254*(big?1:16));           // en pouces (≥ 1 mile) ou en seizièmes
  const per=big?1:16;
  if(r===0)return null;                               // trop petit pour la notation au 1/16
  const mi=big?Math.floor(r/(63360*per)):0; r-=mi*63360*per;
  const ft=Math.floor(r/(12*per)); r-=ft*12*per;
  const inch=Math.floor(r/per); let num=r-inch*per, den=per;
  while(num&&num%2===0&&den>1){num/=2;den/=2;}
  const h=[],t=[];
  if(mi){h.push('<b>'+nf.format(mi)+'</b>&nbsp;mi');t.push(mi+' mi');}
  if(ft){h.push('<b>'+nf.format(ft)+'</b>&nbsp;ft');t.push(ft+' ft');}
  if(inch||num||(!mi&&!ft)){
    const f=num?'<span class="frac"><span>'+num+'</span><span>'+den+'</span></span>':'';
    h.push('<b>'+(inch||!num?inch:'')+'</b>'+(inch&&num?'&#8202;':'')+f+'&nbsp;in');
    t.push((inch||!num?inch:'')+(num?(inch?' ':'')+num+'/'+den:'')+' in');}
  return {html:(neg?'−':'')+h.join(' '),text:(neg?'-':'')+t.join(' '),name:big?'miles, pieds, pouces':'pieds, pouces (au 1/16)'};
}

// ---------- Saisie ----------
function parse(str){
  str=canon(str).replace(/−/g,'-').replace(/(\d)[\s  ](?=\d{3}(\D|$))/g,'$1');
  const ms=str.match(/^\s*(\d+)\s*[:']\s*(\d{1,2})\s*(?:"|″)?\s*(.*)$/);
  if(ms)return {v:+ms[1]+ms[2]/60,unit:ms[3]};
  const fr=str.match(/^\s*([-+]?)(?:(\d+)\s+)?(\d+)\/(\d+)\s*(.*)$/);
  if(fr&&+fr[4]>0){const v=(+(fr[2]||0))+fr[3]/fr[4];return {v:fr[1]==='-'?-v:v,unit:fr[5]};}
  const m=str.match(/^\s*([-+]?(?:\d+(?:[.,]\d*)?|[.,]\d+)(?:e[-+]?\d+)?)\s*(.*)$/i);
  if(!m)return null;
  return {v:parseFloat(m[1].replace(',','.')),unit:m[2]};
}
// Les claviers mobiles produisent des variantes de ° et % : on les ramène aux caractères standard
function canon(s){return s.replace(/[º˚⁰∘]/g,'°').normalize('NFKC').replace(/′′/g,'″').replace(/[٪﹪]/g,'%').replace(/[’‘´`]/g,"'").replace(/[”“]/g,'"');}
function suggest(q,dim,exclude){
  const raw=canon(q).trim(), n=norm(raw);
  let list=Object.values(U).filter(u=>(!dim||u.d===dim)&&!(exclude&&exclude.has(u.id)));
  if(!raw)return list.sort((a,b)=>a.pop-b.pop).slice(0,dim?8:6);
  const sc=u=>{
    if(raw===u.sym)return 100;
    if(!n||!u.nsym&&!u.words.length)return 0;
    if(!u.nsym&&!u.words.slice(1).some(w=>w.startsWith(n)))return 0;
    if(n===u.nsym&&raw.length>1)return 95;
    if(u.words.slice(1).includes(n))return 90;
    if(u.nsym.startsWith(n))return 70;
    if(u.words.some(w=>w.startsWith(n)))return 60;
    if(u.words.some(w=>w.includes(n)))return 30;
    return 0;};
  return list.map(u=>[sc(u),u]).filter(p=>p[0]>0).sort((a,b)=>b[0]-a[0]||a[1].pop-b[1].pop).slice(0,6).map(p=>p[1]);
}
function chipHTML(list,hint){
  if(!list.length)return '<span class="hint">'+(hint||'Unité inconnue')+'</span>';
  return list.map((u,i)=>'<button type="button" class="chip'+(i===0?' first':'')+'" data-u="'+u.id+'"><b>'+u.sym+'</b><span>'+u.name+'</span></button>').join('');
}

// ---------- État ----------
// Historique gardé en mémoire uniquement : il repart de zéro à chaque chargement de la page.
let cards=[];
try{localStorage.removeItem('conv-cards');localStorage.removeItem('conv-pins');}catch(e){}
// unités ajoutées à la main, par grandeur : reprises sur les conversions suivantes
let pins={};
function save(){}

const $list=document.getElementById('list'),$q=document.getElementById('q'),$chips=document.getElementById('chips');

function render(){
  $list.innerHTML=cards.map(c=>{
    const u=U[c.u];
    const rows=rowsFor(c).map(r=>r.html
      ?'<li class="row mix" tabindex="0" data-copy="'+r.copy+'"><span class="k">'+r.k+'</span><span class="v">'+r.html+'</span><span class="n">'+r.name+'</span></li>'
      :'<li class="row'+(r.si?' si':'')+'" tabindex="0" data-copy="'+copyv(r.v,r.u)+'"><span class="k">'+(r.k==='+'?'<button class="unpin" type="button" aria-label="Ne plus afficher '+r.u.sym+'" data-unpin="'+r.u.id+'" data-card="'+c.id+'">×</button>':r.k)+'</span><span class="v"><b>'+show(r.v,r.u)+'</b>&nbsp;'+r.u.sym+'</span><span class="n">'+r.u.name+'</span></li>').join('');
    return '<article class="card" data-id="'+c.id+'"><div class="head"><div class="src">'+show(c.v,u)+'&nbsp;'+u.sym+'<small>'+u.name+'</small></div>'+
      '<button class="x" type="button" aria-label="Supprimer" data-del="'+c.id+'">×</button>'+
      '</div><ul class="rows">'+rows+'</ul><div class="more"><button class="addbtn" type="button" data-add="'+c.id+'">+ autre unité</button></div></article>';
  }).join('');
}
function refreshChips(){
  const val=$q.value;
  if(!val.trim()){$chips.innerHTML='<span class="hint">Tapez un nombre puis une unité</span>';return;}
  const p=parse(val);
  if(!p){$chips.innerHTML='<span class="hint">Commencez par un nombre</span>';return;}
  $chips.innerHTML=chipHTML(suggest(p.unit));
}
function convert(uid){
  const p=parse($q.value); if(!p||!U[uid])return;
  cards.push({id:Date.now().toString(36),v:p.v,u:uid,extra:(pins[U[uid].d]||[]).filter(id=>id!==uid&&U[id])});
  save();render();$q.value='';refreshChips();$q.focus();
  $q.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
$q.addEventListener('input',refreshChips);
$q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=$chips.querySelector('.chip');if(f)convert(f.dataset.u);}});
$chips.addEventListener('mousedown',e=>{if(e.target.closest('.chip'))e.preventDefault();});
$chips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)convert(c.dataset.u);});

// copie, suppression, ajout d'unité
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1200);}
function copy(t){const done=()=>toast('Copié : '+t);
  try{navigator.clipboard.writeText(t).then(done,()=>toast(t));}catch(e){toast(t);}}
$list.addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');
  if(del){cards=cards.filter(c=>c.id!==del.dataset.del);save();render();return;}
  const add=e.target.closest('[data-add]');
  if(add){openAdder(add.dataset.add,add.parentElement);return;}
  const ch=e.target.closest('.chip[data-add-u]');
  if(ch){const c=cards.find(x=>x.id===ch.dataset.card),id=ch.dataset.addU,d=U[c.u].d;
    c.extra=(c.extra||[]).concat(id);pins[d]=(pins[d]||[]).filter(x=>x!==id).concat(id);save();render();return;}
  const un=e.target.closest('[data-unpin]');
  if(un){const c=cards.find(x=>x.id===un.dataset.card),id=un.dataset.unpin,d=U[c.u].d;
    c.extra=(c.extra||[]).filter(x=>x!==id);pins[d]=(pins[d]||[]).filter(x=>x!==id);save();render();toast('Unité retirée des suivantes');return;}
  const row=e.target.closest('.row');
  if(row)copy(row.dataset.copy);
});
$list.addEventListener('keydown',e=>{const row=e.target.closest('.row');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();copy(row.dataset.copy);}});
function openAdder(cid,box){
  const c=cards.find(x=>x.id===cid), u=U[c.u];
  const shown=new Set([u.id,...rowsFor(c).filter(r=>r.u).map(r=>r.u.id)]);
  box.innerHTML='<div class="field"><input class="q small" id="add-'+cid+'" type="text" placeholder="Unité (ex. yd, pied, nœud)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Unité supplémentaire"><div class="chips"></div></div>';
  const inp=box.querySelector('input'), ch=box.querySelector('.chips');
  const upd=()=>{const l=suggest(inp.value,u.d,shown);
    ch.innerHTML=l.length?l.map((x,i)=>'<button type="button" class="chip'+(i===0?' first':'')+'" data-add-u="'+x.id+'" data-card="'+cid+'"><b>'+x.sym+'</b><span>'+x.name+'</span></button>').join(''):'<span class="hint">Aucune autre unité de ce type</span>';};
  inp.addEventListener('input',upd);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=ch.querySelector('.chip');if(f)f.click();}if(e.key==='Escape')render();});
  ch.addEventListener('mousedown',e=>{if(e.target.closest('.chip'))e.preventDefault();});
  upd();inp.focus();
}

render();refreshChips();$q.focus();
</script>
