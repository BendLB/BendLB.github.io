}

}

:root{padding-bottom:0!important}html,body{overflow:hidden;background:#05070c}html{height:100%}body{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;height:auto;display:flex;flex-direction:column}#echo{position:relative!important;flex:1;min-height:0;inset:auto}

<script>
'use strict';
// Écho — outils communs (maths, hasard, icônes). Fonctionne aussi sous Node pour les tests.
(function () {
  const G = typeof window !== 'undefined' ? window : globalThis;
  const E = G.E = G.E || {};
  E.TS = 32;           // taille d'une case, en unités du monde
  E.CW = 15;           // une salle = 15 × 15 cases
  E.ROOM = E.TS * E.CW;
  E.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  E.lerp = (a, b, t) => a + (b - a) * t;
  E.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  E.ang = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
  E.angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
  E.rng = function (seed) {
    let s = seed >>> 0;
    const f = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
    f.pick = a => a[Math.floor(f() * a.length)];
    f.chance = p => f() < p;
    f.range = (a, b) => a + f() * (b - a);
    f.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    f.weighted = (items, w) => { let tot = 0; for (const it of items) tot += w(it); let r = f() * tot; for (const it of items) { r -= w(it); if (r <= 0) return it; } return items[items.length - 1]; };
    return f;
  };
  E.R = E.rng((Date.now() ^ 0x5eed) >>> 0);

<script>
'use strict';
// Écho — fabrication des zones : un arbre de salles, un chemin principal jusqu'au gardien,
// des branches avec trésors, et des passages fermés par des pouvoirs qu'on n'a pas encore.
(function () {
  const E = (typeof window !== 'undefined' ? window : globalThis).E;
  const T = E.T, CW = E.CW;
  const DIRS = [[0, -1, 'n'], [1, 0, 'e'], [0, 1, 's'], [-1, 0, 'w']];
  const GATE_ABILS = ['drill', 'phase', 'hover', 'hack'];

  function walkable(t) { return t === T.FLOOR || t === T.ICE || t === T.GRASS || t === T.PLATE || (t >= 15 && t <= 18); }

  // Chemin principal : marche aléatoire sans repasser
  function mainPath(R, gw, gh, len) {
    for (let tries = 0; tries < 400; tries++) {
      const sx = R.int(0, gw - 1), sy = gh - 1;
      const path = [[sx, sy]], used = new Set([sy * gw + sx]);
      let ok = true;
      while (path.length < len) {
        const [x, y] = path[path.length - 1];
        const opts = DIRS.map(d => [x + d[0], y + d[1]]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < gw && ny < gh && !used.has(ny * gw + nx));
        if (!opts.length) { ok = false; break; }
        // préfère monter : le gardien est loin du départ
        const up = opts.filter(o => o[1] < y);
        const n = (up.length && R() < .45) ? R.pick(up) : R.pick(opts);
        path.push(n); used.add(n[1] * gw + n[0]);
      }
      if (ok) return path;
    }
    return null;
  }

  function genLayout(z, R) {
    const [gw, gh] = z.grid;
    const lenMain = Math.max(4, Math.round(z.cells * .45));
    const mp = mainPath(R, gw, gh, lenMain);
    if (!mp) return null;
    const cells = [], at = new Map();
    const add = (x, y, parent, main) => { const c = { i: cells.length, cx: x, cy: y, parent, main, kids: [], kind: 'normal', depth: parent == null ? 0 : cells[parent].depth + 1 }; cells.push(c); at.set(y * gw + x, c); if (parent != null) cells[parent].kids.push(c.i); return c; };
    mp.forEach(([x, y], k) => add(x, y, k ? k - 1 : null, true));
    const boss = cells[cells.length - 1], ante = cells[cells.length - 2];
    let guard = 0;
    while (cells.length < z.cells && guard++ < 2000) {
      const base = R.pick(cells.filter(c => c !== boss && c !== ante || (c === ante && R() < .2)));
      let cur = base, blen = R.int(1, 3);
      for (let k = 0; k < blen && cells.length < z.cells; k++) {
        const opts = DIRS.map(d => [cur.cx + d[0], cur.cy + d[1]]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < gw && ny < gh && !at.has(ny * gw + nx));
        if (!opts.length) break;
        const [nx, ny] = R.pick(opts);
        cur = add(nx, ny, cur.i, false);
      }
    }
    if (cells.length < z.cells) return null;
    return { gw, gh, cells, at, boss, ante };
  }

  // Remplit l'intérieur d'une salle (cases 1 à 13). « clear » : cases à laisser libres devant les portes.
  function template(R, z, L, kind, clear) {
    const set = (x, y, t) => { if (x < 1 || y < 1 || x > 13 || y > 13 || clear[y * CW + x]) return; L[y * CW + x] = t; };
    const blob = (cx, cy, rad, t) => { for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= rad * rad + .5) set(x, y, t); };
    const hazard = z.lava ? T.LAVA : T.CHASM;
    const opts = ['empty', 'pillars', 'center', 'corners', 'pits', 'crates', 'ring', 'rows', 'diag', 'pillars', 'crates', 'grid', 'cross', 'river'];
    if (z.lava) opts.push('pits', 'pits');
    if (z.id === 1) opts.push('belt', 'belt', 'belt');
    let tp = kind === 'normal' || kind === 'key' ? R.pick(opts) : 'empty';
    if (kind === 'boss') tp = 'boss';
    switch (tp) {
      case 'pillars': { const big = R() < .5; for (const [x, y] of [[4, 4], [10, 4], [4, 10], [10, 10]]) { set(x, y, T.WALL); if (big) { set(x + (x < 7 ? -1 : 1), y, T.WALL); set(x, y + (y < 7 ? -1 : 1), T.WALL); set(x + (x < 7 ? -1 : 1), y + (y < 7 ? -1 : 1), T.WALL); } } break; }
      case 'center': { const t = R() < .5 ? T.WALL : hazard; for (let y = 6; y <= 8; y++) for (let x = 6; x <= 8; x++) set(x, y, t); if (R() < .5) { set(7, 5, t); set(7, 9, t); set(5, 7, t); set(9, 7, t); } break; }
      case 'corners': for (const [x, y, dx, dy] of [[3, 3, 1, 1], [11, 3, -1, 1], [3, 11, 1, -1], [11, 11, -1, -1]]) { set(x, y, T.WALL); set(x + dx, y, T.WALL); set(x + 2 * dx, y, T.WALL); set(x, y + dy, T.WALL); set(x, y + 2 * dy, T.WALL); } break;
      case 'pits': { const n = R.int(2, 3); for (let k = 0; k < n; k++) blob(R.int(3, 11), R.int(3, 11), R.int(1, 2), hazard); break; }
      case 'crates': { const n = R.int(4, 9); for (let k = 0; k < n; k++) set(R.int(2, 12), R.int(2, 12), T.CRATE); break; }
      case 'ring': for (let y = 3; y <= 11; y++) for (let x = 3; x <= 11; x++) { const d = Math.max(Math.abs(x - 7), Math.abs(y - 7)); if (d === 4 && Math.abs(x - 7) > 1 && Math.abs(y - 7) > 1 && !(Math.abs(x - 7) === 4 && Math.abs(y - 7) === 4)) set(x, y, T.WALL); } break;
      case 'rows': { const vert = R() < .5; for (let k = 3; k <= 11; k += 2) { if (vert) { set(4, k, T.WALL); set(10, k, T.WALL); } else { set(k, 4, T.WALL); set(k, 10, T.WALL); } } break; }
      case 'diag': for (let k = 0; k < 4; k++) { set(3 + k, 9 - k, T.WALL); set(8 + k, 6 - k + 1, T.WALL); } break;
      case 'grid': for (let y = 3; y <= 11; y += 4) for (let x = 3; x <= 11; x += 4) if (!(x === 7 && y === 7)) set(x, y, R() < .3 ? T.CRATE : T.WALL); break;
      case 'cross': for (let k = 3; k <= 11; k++) { if (Math.abs(k - 7) > 1) { set(k, 7, T.WALL); set(7, k, T.WALL); } } break;
      case 'river': { const vert = R() < .5, at = R.int(5, 9); for (let k = 1; k <= 13; k++) { if (Math.abs(k - 7) <= 1 && R() < .9) continue; if (vert) { set(at, k, hazard); set(at + 1, k, hazard); } else { set(k, at, hazard); set(k, at + 1, hazard); } } break; }
      case 'belt': { const vert = R() < .5, at = R.int(5, 9), dir = R() < .5 ? 0 : 1; const bt = vert ? (dir ? T.BELT_S : T.BELT_N) : (dir ? T.BELT_E : T.BELT_W); for (let k = 1; k <= 13; k++) for (let w = 0; w < 2; w++) { if (vert) set(at + w, k, bt); else set(k, at + w, bt); } break; }

    }

  // Fiche d'un objet
  function statRows(it) {
    const rows = [];

    if (it.t === 'chassis') { const c = E.chStats(it); rows.push([ic('heart'), '+' + c.hp]); rows.push([ic('armor'), '+' + c.armor + '%']); }

  function affRows(it) {

    if (!other || other === it || isEquipped(it)) return '';

  // ---------- Carte des étoiles ----------
  UI.starmap = function (selZ) {
    UI.trip = null;
    const S = E.S;
    UI.show('<div class="panel">' + top('planet') + '<canvas id="starmap"></canvas><div id="zinfo"></div></div>', { name: 'starmap' });
    const cvs = $('#starmap'); const r = cvs.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    cvs.width = r.width * d; cvs.height = r.height * d; const c = cvs.getContext('2d'); c.scale(d, d);

    const ks = Math.max(1, Math.min(w, h) / 260), yr = Math.max(.55, Math.min(.95, h * .46 / R0)); const pl = E.ZONES.slice(1).map((z, i) => ({ z, r: R0 * (.3 + i * .13), a: i * 2.1 + .6, size: [9, 10, 12, 10, 13, 7][i] * ks }));
    let sel = selZ != null ? selZ : (E.ZONES.find(z => z.id > 0 && !S.bosses[z.id]) || E.ZONES[1]).id;
    const unlocked = z => z.id === 1 ? E.has('nav') : z.id === 6 ? E.has('core') : !!S.bosses[z.id - 1];
    for (const p of pl) { const Z = S.zones[p.z.id], its = E.genZone(p.z.id, Z.seed).items.filter(it => it.kind !== 'chest' && it.kind !== 'key'); p.full = S.bosses[p.z.id] && its.every(it => Z.took[it.kind + ':' + it.cell + (it.id != null ? ':' + it.id : '')]); }
    const t0 = performance.now();
    const n = Object.keys(S.bosses).length;
    function draw() {
      if (!cvs.isConnected) return;
      const t = (performance.now() - t0) / 1000;
      c.clearRect(0, 0, w, h);
      // l'étoile grossit à mesure que la fin approche
      const sr = Math.min(w, h) * (.06 + n * .008);
      const g = c.createRadialGradient(cx, cy, sr * .3, cx, cy, sr * 3); g.addColorStop(0, '#ffd0a0'); g.addColorStop(.3, 'rgba(255,90,50,.45)'); g.addColorStop(1, 'rgba(255,60,30,0)');

      c.fillStyle = '#ff7744'; c.beginPath(); c.arc(cx, cy, sr * (1 + .03 * Math.sin(t * 2)), 0, 7); c.fill();
      for (const p of pl) {
        const a = p.a + t * .02 * (8 - p.z.id);

        const gg = c.createRadialGradient(p.x - p.size * .4, p.y - p.size * .4, 1, p.x, p.y, p.size); gg.addColorStop(0, E.shade(p.z.pal.acc, 1.2)); gg.addColorStop(1, E.shade(p.z.pal.wall, .8));
        c.fillStyle = gg; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 7); c.fill();

        if (S.bosses[p.z.id]) E.drawIconCtx(c, p.full ? 'star' : 'check', p.x + p.size, p.y - p.size, 14, p.full ? '#ffd36b' : '#6fff9a');
        else if (!un) E.drawIconCtx(c, 'lock', p.x + p.size, p.y - p.size, 13, '#889');
        if (S.zones[p.z.id].flawless) { c.strokeStyle = '#ffd36b'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.size + 4, 0, 7); c.stroke(); }
        if (p.z.id === sel) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.setLineDash([4, 4]); c.lineDashOffset = -t * 20; c.beginPath(); c.arc(p.x, p.y, p.size + 8, 0, 7); c.stroke(); c.setLineDash([]); }
      }
      // l'Arche
      const ax = cx + Math.cos(t * .05 + 2.6) * R0 * .2, ay = cy + Math.sin(t * .05 + 2.6) * R0 * .2 * yr;
      if (UI.trip) { const p = pl.find(q => q.z.id === UI.trip.z), k = Math.min(1, (performance.now() - UI.trip.t0) / 1300), e2 = k * k * (3 - 2 * k);
        const sx = ax + (p.x - ax) * e2, sy = ay + (p.y - ay) * e2 - Math.sin(e2 * Math.PI) * 40;
        c.strokeStyle = 'rgba(127,232,255,.5)'; c.setLineDash([3, 5]); c.beginPath(); c.moveTo(ax, ay); c.quadraticCurveTo((ax + p.x) / 2, (ay + p.y) / 2 - 80, p.x, p.y); c.stroke(); c.setLineDash([]);
        E.drawIconCtx(c, 'ship', sx, sy, 20, '#ffffff'); c.fillStyle = 'rgba(127,232,255,.6)'; c.beginPath(); c.arc(sx, sy + 10, 4 + Math.random() * 3, 0, 7); c.fill();
        if (k >= 1 && !UI.trip.done) { UI.trip.done = 1; const z = UI.trip.z; setTimeout(() => { UI.trip = null; UI.close(); UI.travel(z); }, 150); }
      } else E.drawIconCtx(c, 'ship', ax, ay, 16, '#bff6ff');

    }

      const un = unlocked(z);

        '<div class="acts">' + (un ? '<button class="go" data-go>' + ic('ship') + ic('arrowright') + '</button>' : '<button disabled>' + ic('lock') + (sel === 6 ? ic('core') : ic('skull')) + '</button>') + '</div></div>';

        scr.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { click(); E.S = null; E.S = E.newSave(); E.S.seen = {}; E.S.diff = +b.dataset.d; E.save(); UI.close(); begin(); })); return; }
      E.S = E.loadSave(); UI.close(); E.audio.applyOpts();

    };
    const begin = () => { E.playCine(['intro1', 'intro2', 'intro3', 'intro4'], () => { E.enterZone('H', 1); G.camSnap = 1; UI.help(); UI.onClose = () => UI.firstHints(); }); };
    { const hb = document.createElement('button'); hb.className = 'x'; hb.style.cssText = 'position:absolute;right:12px;top:12px;font-size:22px'; hb.innerHTML = '?'; hb.addEventListener('click', () => { click(); UI.help(); UI.onClose = () => setTimeout(() => UI.title(), 0); }); scr.appendChild(hb); 
      // importer une sauvegarde dès l'écran titre (passer de Safari à l'icône de l'écran d'accueil)
      const ib = document.createElement('button'); ib.className = 'x'; ib.id = 'timp'; ib.style.cssText = 'position:absolute;left:12px;top:12px;font-size:22px'; ib.innerHTML = ic('import');
      ib.addEventListener('click', () => { click(); UI.show('<div class="panel"><div class="center"><div class="bigic" style="color:#7fe8ff">' + ic('import') + '</div><textarea class="code" style="width:min(86vw,420px);height:140px"></textarea><div class="row" style="justify-content:center;gap:14px"><button class="tbtn" id="ino" style="min-width:110px">' + ic('close') + '</button><button class="tbtn" id="iyes" style="min-width:110px">' + ic('check') + '</button></div></div></div>', { closable: false, name: 'import' });
        $('#ino').addEventListener('click', () => { click(); UI.title(); });
        $('#iyes').addEventListener('click', () => { const ta = scr.querySelector('textarea'); if (E.importSave(ta.value)) location.reload(); else { ta.style.borderColor = '#f55'; E.audio.play('deny'); } }); });
      scr.appendChild(ib); }
    const cb = $('#cont'); if (cb) cb.addEventListener('click', () => start(false));
    $('#neu').addEventListener('click', () => {
      if (!sv) return start(true);
      // une partie existe : confirmation en images (la sauvegarde sera remplacée)
      click(); UI.show('<div class="panel"><div class="center"><div class="bigic" style="color:#ff6b7a">' + ic('trash') + '</div><div class="sub" style="font-size:22px">' + ic('xp') + sv.lvl + ' · ' + ic('clock') + h + '</div>' +
        '<div class="row" style="justify-content:center;gap:14px"><button class="tbtn" id="nno" style="min-width:120px">' + ic('close') + '</button><button class="tbtn" id="nyes" style="min-width:120px;color:#ff6b7a!important;border-color:#ff6b7a!important">' + ic('trash') + ic('check') + '</button></div></div></div>', { closable: false, name: 'confirm' });
      $('#nno').addEventListener('click', () => { click(); UI.title(); });
      $('#nyes').addEventListener('click', () => start(true));
    });
  };
  // Le premier réveil : une main qui montre où glisser
  UI.firstHints = function () {
    const hint = $('#hint'); hint.hidden = false; hint.innerHTML = ic('hand');
    hint.style.left = '18%'; hint.style.top = '68%'; UI.moved = false;
    const p0 = G.P ? { x: G.P.x, y: G.P.y } : null, t0 = Date.now();
    const iv = setInterval(() => { const far = p0 && G.P && E.dist(p0.x, p0.y, G.P.x, G.P.y) > 80; if (UI.moved || far || G.mode !== 'play' || Date.now() - t0 > 90000) { hint.hidden = true; clearInterval(iv); } }, 300);
    // Mère montre la direction de l'ascenseur
    setTimeout(() => UI.tick(ic('core') + ' ' + ic('arrowright') + ' ' + ic('down'), '#9ff0ff'), 1500);
  };
  E.on('zone', z => {
    if (z.hub && E.S) { const n = Object.keys(E.S.bosses).length; if (n > (E.S.lastHubN || 0)) { E.S.lastHubN = n; const g = E.ZONES.find(zz => !E.S.bosses[zz.id]); if (g) setTimeout(() => UI.tick('<span style="color:#9ff0ff">' + ic('core') + '</span> ' + ic('arrowright') + ' <span style="color:' + g.pal.acc + '">' + ic(g.id ? 'planet' : 'down') + ' ' + g.name + '</span>', '#9ff0ff'), 1200); } }
    setTimeout(() => { UI.lastZone = z.zid; }, 0);
    UI.showPlay(true); lastAct = 'x';
    E.audio.setMusic && E.audio.setMusic(z.hub ? 'H' : z.zid);
    if (z.zid === 'R') UI.tick('<span style="color:#d27bff;font:800 18px system-ui;letter-spacing:.1em">' + ic('rift') + ' ' + (E.S.riftBest || 0) + '</span>');
    else if (!z.hub && UI.lastZone !== z.zid) { const zd = E.ZONES[z.zid]; const d = document.createElement('div'); d.className = 'bossintro'; d.innerHTML = '<div style="color:' + zd.pal.acc + '">' + ic(z.zid === 0 ? 'down' : 'planet') + '</div><b style="color:' + zd.pal.acc + '">' + zd.name + '</b>'; $('#echo').appendChild(d); setTimeout(() => d.remove(), 2600); }
  });
  E.on('ending', () => {
    E.S.seen.ending = 1; E.save();
    ['clock', 'xp', 'target', 'skull', 'drone', 'memory', 'trophy'].forEach(i => E.iconImg(i, '#7fe8ff')); // préchargées pour la carte souvenir
    E.playCine(['end0', 'end1', 'end2', 'end3', 'end4', 'end5'], () => {
      const S = E.S, h = Math.floor(S.time / 3600), m = Math.floor(S.time / 60) % 60;
      UI.show('<div class="panel"><div class="center"><div class="title" style="font-size:54px">ÉCHO</div><div class="bigic" style="color:#ffe27a">' + ic('trophy') + '</div><div class="row" style="justify-content:center"><span class="chip">' + ic('clock') + h + ' h ' + String(m).padStart(2, '0') + '</span><span class="chip">' + ic('xp') + S.lvl + '</span><span class="chip">' + ic('target') + S.kills + '</span><span class="chip">' + ic('skull') + S.deaths + '</span><span class="chip">' + ic('drone') + S.drones.length + '/12</span><span class="chip">' + ic('memory') + S.mem.filter(x => typeof x === 'number').length + '/7</span></div><button class="tbtn" data-close>' + ic('core') + '</button></div></div>', { name: 'end' });
      // carte souvenir : une image à garder (appui long sur iPhone)
      const img = UI.souvenir(); if (img) { const d = document.createElement('img'); d.src = img; d.style.cssText = 'width:min(70vw,280px);border-radius:14px;box-shadow:0 0 30px rgba(127,232,255,.3)'; scr.querySelector('.center').insertBefore(d, scr.querySelector('.center .tbtn')); scr.querySelectorAll('.center > .row, .center > .title').forEach(n => n.remove()); } // la carte reprend déjà titre et chiffres
      UI.onClose = () => { E.enterZone('H', 1); G.camSnap = 1; };
    });
  });
  UI.souvenir = function () {
    try {
      const S = E.S, c = document.createElement('canvas'); c.width = 600; c.height = 800; const x = c.getContext('2d');
      x.fillStyle = '#060a12'; x.fillRect(0, 0, 600, 800);
      E.drawScene(x, 600, 560, 'end5', 9);
      const gb = x.createLinearGradient(0, 500, 0, 560); gb.addColorStop(0, 'rgba(6,10,18,0)'); gb.addColorStop(1, 'rgba(6,10,18,1)'); x.fillStyle = gb; x.fillRect(0, 500, 600, 60); // les chiffres sous l'image, sans chevauchement
      const h = Math.floor(S.time / 3600), m = Math.floor(S.time / 60) % 60;
      const rows = [['clock', h + ' h ' + String(m).padStart(2, '0')], ['xp', S.lvl], ['target', S.kills], ['skull', S.deaths], ['drone', S.drones.length + '/12'], ['memory', S.mem.filter(v => typeof v === 'number').length + '/7'], ['trophy', Object.keys(S.trophies || {}).length + '/' + E.TROPHIES.length], ['skull', '×' + ((S.diff != null ? S.diff : 1) + 1)]];
      x.font = '800 30px system-ui'; x.textAlign = 'left'; x.fillStyle = '#fff';
      rows.forEach(([i, v], k) => { const cx = 60 + (k % 2) * 270, cy = 598 + Math.floor(k / 2) * 50; E.drawIconCtx(x, i, cx, cy - 10, 34, '#7fe8ff'); x.fillText(String(v), cx + 30, cy); });
      x.font = '600 18px system-ui'; x.fillStyle = 'rgba(255,255,255,.6)'; x.textAlign = 'center'; x.fillText(new Date().toLocaleDateString('fr-FR'), 300, 785);
      return c.toDataURL('image/png');
    } catch (e) { return null; }
  };
  E.ICONS.arrowright = '<path d="M4 12h15M13 6l6 6-6 6" stroke-width="2.6"/>';
})();

<script>
'use strict';
// Écho — démarrage et boucle principale.
(function () {
  const E = window.E, G = E.G, UI = E.UI;
  E.resize(); addEventListener('resize', () => { E.resize(); });
  let last = performance.now(), acc = 0, saveT = 0, slowN = 0;
  const STEP = 1 / 60;
  let errN = 0, bgN = 0;
  const scr = document.getElementById('screen');
  function frame(now) {
    requestAnimationFrame(frame);
    try { tick(now); } catch (e) { if (errN++ < 5) console.error('Écho :', e); E.errors = errN; }
  }
  function tick(now) {
    let dt = Math.min(.1, (now - last) / 1000); last = now;
    const paused = !!UI.open || document.hidden;
    if (G.W && (G.mode === 'play' || G.mode === 'dead') && !paused) {
      UI.readKeys();
      acc += dt; let n = 0;
      const sl = E.S && E.S.opts.slow ? .8 : 1;
      while (acc >= STEP && n < 5) { E.step(STEP * sl, UI.IN); acc -= STEP; n++; }
      if (n >= 5) acc = 0;
      saveT += dt; if (saveT > 20) { saveT = 0; E.save(); }
    } else { acc = 0; if (UI.open) UI.readPad(); }
    // menu ouvert : la scène floutée derrière n'a pas besoin de 60 images/s (batterie, chauffe)
    const behind = UI.open && !scr.classList.contains('clear') && G.mode === 'play';
    if (G.W && G.mode !== 'title' && (!behind || (bgN++ % 8) === 0)) { E.render(now / 1000); UI.hud(dt); }
    // si l'appareil peine, on dessine en définition plus basse
    if (!E.lowQ && G.W && !paused && G.mode === 'play') { slowN = dt > .03 ? slowN + 1 : Math.max(0, slowN - 1); if (slowN > 90) { E.lowQ = true; E.resize(); } }
  }
  // retour dans le jeu après l'avoir quitté (appel, autre appli) : pause, pour ne pas reprendre en plein combat
  let awayT = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { E.save(); awayT = performance.now(); return; }
    if (awayT && performance.now() - awayT > 1500 && G.W && G.mode === 'play' && !UI.open && (G.W.sealed || G.W.boss || G.W.rift)) UI.pause();
    awayT = 0;
  });
  addEventListener('pagehide', () => E.save());
  window.__echo = E;
  // sur le site : copie locale pour jouer hors connexion (portée limitée à la page du jeu)
  if ('serviceWorker' in navigator && /\/echo\.html$/.test(location.pathname)) navigator.serviceWorker.register('echo-sw.js', { scope: './echo' }).catch(() => { });
  UI.title();
  requestAnimationFrame(frame);
})();

</script>
